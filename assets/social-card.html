<!doctype html>
<!--
  assets/social-card.html — source for public/social-card.png

  The Open Graph image is a raster and cannot be generated by the Astro build, so it
  is authored here and captured with headless Chrome. It is NOT a route: adding one
  would ship a page that exists only to be screenshotted, and would inflate the route
  count that /colophon publishes.

  Regenerate after any change to the title, tagline or palette:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=public/social-card.png --window-size=1200,630 \
      --virtual-time-budget=10000 \
      assets/social-card.html

  Token values are inlined below because this file is rendered outside Vite and cannot
  import global.css. Keep them in step with the @theme block there; the card is the
  one surface where a stale palette ships without anything failing.

  The copy must match src/components/HeroSection.astro. This card previously carried
  "Senior Frontend Engineer" for months after the site said otherwise, because nothing
  connects the two.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --color-bg: #14110f;
    --color-border: #322b25;
    --color-text: #f2ede6;
    --color-muted: #b8ada0;
    --color-muted-soft: #918678;
    --color-accent: #e8a33d;
    --tracking-label: 0.16em;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  .label {
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 15px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
  }

  /* Masthead bar, matching the site's sticky nav: hairline rule, wordmark left,
     domain right. */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 64px;
    border-bottom: 1px solid var(--color-border);
  }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark svg { height: 26px; width: auto; fill: var(--color-text); }

  /* Two columns, mirroring the homepage masthead at lg: the statement on the left,
     a ruled spec block hanging in the right margin. A single column left the right
     third of the frame empty, which reads as an accident rather than as restraint. */
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    align-items: center;
    gap: 56px;
    padding: 0 64px;
  }

  h1 {
    font-size: 96px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  .tagline {
    margin-top: 24px;
    font-size: 29px;
    line-height: 1.42;
    color: var(--color-muted);
  }

  .spec { border-top: 1px solid var(--color-border); }
  .spec div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 13px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .spec dt { color: var(--color-muted-soft); }
  .spec dd {
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 15px;
    color: var(--color-text);
    text-align: right;
  }
  .spec .live { display: flex; align-items: center; gap: 9px; }
  .spec .live i { display: block; width: 9px; height: 9px; background: var(--color-accent); }
  /* The claim words carry the same underline as the h1 on the homepage, so the card
     and the masthead read as the same document. */
  .tagline mark {
    background: none;
    color: var(--color-text);
    border-bottom: 2px solid var(--color-muted-soft);
    padding-bottom: 1px;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 26px 64px 34px;
    border-top: 1px solid var(--color-border);
  }
  .stack { color: var(--color-muted-soft); }
  .stack .sep { color: var(--color-border); padding: 0 6px; }
  .status { display: flex; align-items: center; gap: 11px; color: var(--color-muted); white-space: nowrap; }
  .status i { display: block; width: 9px; height: 9px; background: var(--color-accent); }
</style>
</head>
<body>
  <div class="bar">
    <div class="mark">
      <svg viewBox="0 0 190.15 108.83" role="img" aria-hidden="true">
        <path d="M89.83,44.86a16.56,16.56,0,0,0-5.51-12.68,19.2,19.2,0,0,0-13.55-5.12H45.24V82.21H55.8V62.78H68.65L78.13,78.7l4.73-11.85L79.35,61A17.43,17.43,0,0,0,89.83,44.86ZM70.77,53h-15V36.86h15a7.78,7.78,0,0,1,8,8A7.85,7.85,0,0,1,70.77,53Z"/>
        <path d="M139.55,64.05A17.43,17.43,0,0,1,124,73.19a16.92,16.92,0,0,1-12.7-5.29,18.44,18.44,0,0,1-5-13.26,2.23,2.23,0,0,1,0-.37L99.78,70.63a28.86,28.86,0,0,0,3.68,4.58A28.14,28.14,0,0,0,124,83.41a29,29,0,0,0,15.43-4.17A27,27,0,0,0,149.78,67.9Zm-.08-33.89A28.5,28.5,0,0,0,124,25.89a29.69,29.69,0,0,0-6.71.71l-5.87,14.7A16.9,16.9,0,0,1,124,36.06a17.42,17.42,0,0,1,15.51,9.24l10.23-3.88A26.18,26.18,0,0,0,139.47,30.16Z"/>
        <polygon points="112.87 27.89 123.99 0 113.43 0 70.06 108.83 80.62 108.83 112.87 27.89"/>
        <polygon points="150.85 7.28 150.85 22.2 182.69 54.04 150.85 85.85 150.85 100.77 190.15 61.5 190.15 46.58 150.85 7.28"/>
        <polygon points="0 62.28 39.3 101.56 39.3 86.64 7.46 54.82 39.3 22.98 39.3 8.06 0 47.36 0 62.28"/>
      </svg>
      <span class="label">Ryan Choi</span>
    </div>
    <span class="label" style="color: var(--color-muted-soft)">Senior Full-Stack Engineer</span>
  </div>

  <div class="body">
    <div>
      <h1>Ryan Choi</h1>
      <p class="tagline">Builds <mark>fast</mark>, <mark>accessible</mark> software for product teams.</p>
    </div>

    <dl class="spec">
      <div><dt class="label">Focus</dt><dd>Design systems</dd></div>
      <div><dt class="label">Domains</dt><dd>Fintech · SaaS</dd></div>
      <div><dt class="label">Status</dt><dd class="live"><i></i>Open to work</dd></div>
    </dl>
  </div>

  <div class="foot">
    <span class="label stack">TypeScript<span class="sep">/</span>Vue<span class="sep">/</span>React<span class="sep">/</span>Node.js<span class="sep">/</span>PHP<span class="sep">/</span>PostgreSQL</span>
    <span class="label status">ryanchoi.dev</span>
  </div>
</body>
</html>
